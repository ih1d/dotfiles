# ── existing ────────────────────────────────────────────────
set -g allow-passthrough on
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ── behaviour ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc,*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on

# splits that keep the cwd; hjkl panes to match aerospace muscle memory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display-message " config reloaded"

# ── gruvbox dark ────────────────────────────────────────────
BG0="#1d2021"
BG1="#3c3836"
BG2="#504945"
BG3="#665c54"
FG1="#ebdbb2"
GRAY="#928374"
YELLOW="#fabd2f"

set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-style "bg=$BG0,fg=$FG1"

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=$BG0,bg=$YELLOW,bold]  #S #[fg=$YELLOW,bg=$BG0,nobold]"
set -g status-right "#[fg=$BG1]#[fg=$FG1,bg=$BG1]  #{pane_current_command} #[fg=$BG2,bg=$BG1]#[fg=$FG1,bg=$BG2] 󰃰 %a %d %b #[fg=$YELLOW,bg=$BG2]#[fg=$BG0,bg=$YELLOW,bold]  %H:%M "

setw -g window-status-format "#[fg=$GRAY,bg=$BG0] #I·#W "
setw -g window-status-current-format "#[fg=$BG0,bg=$BG2]#[fg=$YELLOW,bg=$BG2,bold] #I·#W #[fg=$BG2,bg=$BG0,nobold]"
setw -g window-status-separator ""

set -g pane-border-style "fg=$BG2"
set -g pane-active-border-style "fg=$YELLOW"

set -g message-style "bg=$YELLOW,fg=$BG0,bold"
set -g message-command-style "bg=$BG2,fg=$FG1"

setw -g mode-style "bg=$BG3,fg=$FG1"
set -g display-panes-active-colour "$YELLOW"
set -g display-panes-colour "$BG3"
set -g clock-mode-colour "$YELLOW"
