# ─────────────────────────────────────────────────────────────
#  Starship — gruvbox dark, full-width bar
#
#  One continuous bar spanning the terminal, matching sketchybar
#  up top and the tmux bar in between:
#
#   󰀵 isaaclopez │  ~/P/dotfiles │  main ●2 ─────── 󱎫 1.2s │  16:22
#   ❯
#
#  Design rule: EVERY segment paints bg:color_bg1, and each
#  optional segment carries its own leading "│" divider. That way
#  a missing module leaves no orphaned separator behind.
# ─────────────────────────────────────────────────────────────

format = """
[](fg:color_bg1)\
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$python\
$haskell\
$java\
$zig\
$docker_context\
$conda\
$fill\
$cmd_duration\
$time\
[](fg:color_bg1)\
$line_break\
$character"""

palette = 'gruvbox_dark'
add_newline = true

[palettes.gruvbox_dark]
color_fg0    = '#fbf1c7'
color_fg1    = '#ebdbb2'
color_bg0    = '#1d2021'
color_bg1    = '#3c3836'
color_bg2    = '#504945'
color_bg3    = '#665c54'
color_gray   = '#928374'
color_blue   = '#83a598'
color_aqua   = '#8ec07c'
color_green  = '#b8bb26'
color_orange = '#fe8019'
color_purple = '#d3869b'
color_red    = '#fb4934'
color_yellow = '#fabd2f'

# ── the bar fill: stretches left half to right half ───────────
[fill]
symbol = "─"
style = "fg:color_bg2 bg:color_bg1"

# ── left: identity ────────────────────────────────────────────
[os]
disabled = false
format = '[ $symbol](fg:color_yellow bg:color_bg1)'

[os.symbols]
Macos  = "󰀵 "
Arch   = "󰣇 "
Debian = "󰣚 "
Ubuntu = "󰕈 "
Fedora = "󰣛 "
NixOS  = " "
Linux  = "󰌽 "

[username]
show_always = true
style_user = "fg:color_fg0 bg:color_bg1"
style_root = "fg:color_red bg:color_bg1"
format = '[$user ]($style)'

[directory]
format = '[│ ](fg:color_bg3 bg:color_bg1)[ $path ](fg:color_blue bg:color_bg1)[$read_only](fg:color_red bg:color_bg1)'
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music"     = "󰝚"
"Pictures"  = ""
"Projects"  = "󰲋"
"Developer" = "󰲋"

# ── middle: vcs ───────────────────────────────────────────────
[git_branch]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $branch ](fg:color_aqua bg:color_bg1)'

[git_status]
format = '[($all_status$ahead_behind )](fg:color_yellow bg:color_bg1)'
conflicted = "󰞇 "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
untracked  = "?${count} "
stashed    = " "
modified   = "●${count} "
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "✘${count} "

# ── middle: toolchains ────────────────────────────────────────
[nodejs]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $version ](fg:color_green bg:color_bg1)'

[c]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $version ](fg:color_blue bg:color_bg1)'

[rust]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $version ](fg:color_orange bg:color_bg1)'

[golang]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $version ](fg:color_aqua bg:color_bg1)'

[python]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $version(($virtualenv)) ](fg:color_yellow bg:color_bg1)'

[haskell]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $version ](fg:color_purple bg:color_bg1)'

[java]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $version ](fg:color_red bg:color_bg1)'

[zig]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $version ](fg:color_orange bg:color_bg1)'

[docker_context]
symbol = ""
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $context ](fg:color_blue bg:color_bg1)'

[conda]
format = '[│ ](fg:color_bg3 bg:color_bg1)[$symbol $environment ](fg:color_green bg:color_bg1)'

# ── right: timing ─────────────────────────────────────────────
[cmd_duration]
min_time = 500
show_milliseconds = false
format = '[󱎫 $duration ](fg:color_yellow bg:color_bg1)[│ ](fg:color_bg3 bg:color_bg1)'

[time]
disabled = false
time_format = "%H:%M"
format = '[ $time ](fg:color_fg0 bg:color_bg1)'

# ── the input line ────────────────────────────────────────────
[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol   = '[❯](bold fg:color_red)'
vimcmd_symbol  = '[❮](bold fg:color_green)'
