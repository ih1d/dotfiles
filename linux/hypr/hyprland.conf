# ═══════════════════════════════════════════════════════════════
#  Hyprland — gruvbox rice (Wayland)
#  The Linux counterpart of macos/aerospace/aerospace.toml.
#  Geometry and keys mirror CLAUDE.md §2 and §3 exactly.
#
#  NOTE: written on macOS from the spec — verify on first boot.
#  The `shadow {}` block requires Hyprland ≥ 0.42; on older
#  versions use the flat `drop_shadow = true` keys instead.
# ═══════════════════════════════════════════════════════════════

$mainMod  = ALT
$terminal = ghostty
$browser  = zen-browser
$menu     = wofi --show drun

monitor = , preferred, auto, 1

exec-once = waybar
exec-once = hyprpaper

# ── look ───────────────────────────────────────────────────────
general {
    gaps_in     = 4          # 4 per side = the 8px inner gap in the spec
    gaps_out    = 8
    border_size = 5
    col.active_border   = rgb(fabd2f)   # GB_ACCENT
    col.inactive_border = rgb(3c3836)   # GB_SURFACE
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity   = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size    = 6
        passes  = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range   = 20
        render_power = 3
        color = rgba(1d2021ee)
    }
}

animations {
    enabled = true
    bezier    = rice, 0.05, 0.9, 0.1, 1.05
    animation = windows,     1, 5, rice
    animation = windowsOut,  1, 5, default, popin 80%
    animation = border,      1, 8, default
    animation = fade,        1, 6, default
    animation = workspaces,  1, 5, rice, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ── keys: see CLAUDE.md §3 ─────────────────────────────────────
# alt+b and alt+f stay free for readline (backward-word/forward-word)
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, B, exec, $browser
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod, SLASH, togglesplit
bind = $mainMod, COMMA, togglegroup

# focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# move
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# resize
binde = $mainMod, MINUS, resizeactive, -50 0
binde = $mainMod, EQUAL, resizeactive,  50 0

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, TAB, workspace, previous

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# media
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle

# ── window rules: the float list from aerospace.toml ───────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(zoom)$
windowrulev2 = float, title:^(Picture-in-Picture)$
