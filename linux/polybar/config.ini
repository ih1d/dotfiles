; ═══════════════════════════════════════════════════════════════
;  Polybar — gruvbox rice (X11, pairs with linux/i3/config)
;  Same 36px floating bar as sketchybar/waybar. See CLAUDE.md §2.
;  NOTE: written from the spec on macOS — verify on first boot.
; ═══════════════════════════════════════════════════════════════

[colors]
bg0_h  = #e61d2021
bg0    = #282828
bg1    = #3c3836
bg2    = #504945
bg3    = #665c54
fg1    = #ebdbb2
fg3    = #bdae93
gray   = #928374
red    = #fb4934
green  = #b8bb26
yellow = #fabd2f
blue   = #83a598
purple = #d3869b
aqua   = #8ec07c
orange = #fe8019

[bar/rice]
width  = 100%:-16
height = 36
offset-x = 8
offset-y = 6
radius = 10
bottom = false
fixed-center = false

background = ${colors.bg0_h}
foreground = ${colors.fg1}

border-size  = 2
border-color = ${colors.bg1}

padding-left  = 1
padding-right = 1
module-margin = 1

font-0 = Iosevka Nerd Font:style=Semibold:size=11;3
font-1 = Iosevka Nerd Font:style=Bold:size=13;3

modules-left  = i3 sep window
modules-right = cpu memory volume battery date

cursor-click = pointer
enable-ipc = true
wm-restack = i3

[module/i3]
type = internal/i3
format = <label-state><label-mode>
index-sort = true
pin-workspaces = false

label-mode-padding = 2
label-mode-foreground = ${colors.bg0}
label-mode-background = ${colors.orange}

label-focused = %index%
label-focused-foreground = ${colors.bg0}
label-focused-background = ${colors.yellow}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.fg3}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.fg3}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.bg0}
label-urgent-background = ${colors.red}
label-urgent-padding = 2

[module/sep]
type = custom/text
content =
content-foreground = ${colors.bg3}

[module/window]
type = internal/xwindow
label = "  %title:0:44:…%"
label-foreground = ${colors.aqua}

[module/cpu]
type = internal/cpu
interval = 3
format = <label>
label = "  %percentage%%"
label-foreground = ${colors.blue}

[module/memory]
type = internal/memory
interval = 5
format = <label>
label = "  %percentage_used%%"
label-foreground = ${colors.purple}

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = "  %percentage%%"
label-volume-foreground = ${colors.aqua}
label-muted = "  muted"
label-muted-foreground = ${colors.gray}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
low-at = 10
format-charging   = <label-charging>
format-discharging = <label-discharging>
label-charging    = "  %percentage%%"
label-charging-foreground = ${colors.green}
label-discharging = "  %percentage%%"
label-discharging-foreground = ${colors.green}
label-low = "  %percentage%%"
label-low-foreground = ${colors.red}

[module/date]
type = internal/date
interval = 10
date = "  %a %d %b  %H:%M"
label = %date%
label-foreground = ${colors.yellow}
label-background = ${colors.bg0}
label-padding = 2

[settings]
screenchange-reload = true
pseudo-transparency = false
