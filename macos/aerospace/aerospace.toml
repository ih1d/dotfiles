# ─────────────────────────────────────────────────────────────
#  AeroSpace — gruvbox rice
#  docs: https://nikitabobko.github.io/AeroSpace/guide
# ─────────────────────────────────────────────────────────────

config-version = 2

start-at-login = true

# Keep 1-9 alive even when empty, so the sketchybar workspace row
# never changes width. Empty ones render dimmed (see plugins/aerospace.sh).
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/borders',
  'exec-and-forget /opt/homebrew/bin/sketchybar',
]

# Normalization keeps the tree tidy instead of deeply nested
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Don't let the mouse lag behind the focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Tell sketchybar which workspace is live
exec-on-workspace-change = [
  '/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

[key-mapping]
preset = 'qwerty'

# outer.top leaves room for the floating sketchybar (36 height + 6 offset + gap)
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 50
outer.right      = 8

# ─────────────────────────────── main mode
[mode.main.binding]

# launchers
# NOTE: alt-f deliberately left free — readline uses it for forward-word.
# cmd-b is the browser by explicit choice; readline's backward-word is no
# longer reachable in the terminal (use ESC b). Fullscreen stays on cmd-shift.
# `open -na Ghostty` would fork a whole new app process per press; `open -a`
# only raises the existing one. Ghostty ships an AppleScript dictionary
# (Contents/Resources/Ghostty.sdef) with a real `new window` — one process,
# one new window. Needs Automation permission, same as the power menu.
cmd-enter = 'exec-and-forget osascript -e "tell application \"Ghostty\" to new window"'
cmd-b     = 'exec-and-forget open -a Zen'
cmd-x     = 'close'
# lock / logout / sleep / restart / shutdown — macos/powermenu.sh
cmd-shift-q = 'exec-and-forget $HOME/.local/bin/rice-powermenu'

# focus
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

# move window
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

# resize
cmd-minus  = 'resize smart -50'
cmd-equal  = 'resize smart +50'
cmd-shift-0 = 'balance-sizes'

# layouts
cmd-slash   = 'layout tiles horizontal vertical'
cmd-comma   = 'layout accordion horizontal vertical'
cmd-shift-f = 'fullscreen'
cmd-shift-space = 'layout floating tiling'

# join (merge window into neighbour's container)
cmd-shift-ctrl-h = 'join-with left'
cmd-shift-ctrl-j = 'join-with down'
cmd-shift-ctrl-k = 'join-with up'
cmd-shift-ctrl-l = 'join-with right'

# workspaces
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'

cmd-tab = 'workspace-back-and-forth'
cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# service mode
cmd-shift-semicolon = 'mode service'

# ─────────────────────────────── service mode
[mode.service.binding]
esc         = ['reload-config', 'mode main']
r           = ['flatten-workspace-tree', 'mode main']  # reset layout
f           = ['layout floating tiling', 'mode main']
backspace   = ['close-all-windows-but-current', 'mode main']

cmd-shift-h = ['join-with left', 'mode main']
cmd-shift-j = ['join-with down', 'mode main']
cmd-shift-k = ['join-with up', 'mode main']
cmd-shift-l = ['join-with right', 'mode main']

# ─────────────────────────────── window rules
# Things that should never be tiled
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Copy|Info'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.tailscale.ipn.macsys'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'layout floating'
